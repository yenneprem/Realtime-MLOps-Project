name: MLOps pipeline
on:
    push:
        branches:
            - cicd
env:
    S3_BUCKET: churn-model-bucket-cicd-prem
jobs:
    train-deploy:
        runs-on: self-hosted
        permissions:
            contents: write
        steps:
            - name: checkout repo
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - name: install dep
              run: |
                pip install -r requirements.txt
                pip install pytest pytest-cov
      #       - name: Run tests with coverage
      #         shell: powershell
      #         run: |
      #          pytest --cov=. --cov-report=xml
      #       - name: sonarsource
      #         uses: sonarsource/sonarqube-scan-action@master
      #         env:
      #           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #           SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # # If you wish to fail your job when the Quality Gate is red, uncomment the
      # # following lines. This would typically be used to fail a deployment.
      #       - name: gates
      #         uses: sonarsource/sonarqube-quality-gate-action@master
      #         timeout-minutes: 5
      #         env:
      #           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            - name: Generate DataSet
              run: |
                 python generate_data.py
            - name: Train the model
              run: python train.py
            - name: Run tests with coverage
              shell: powershell
              run: |
               pytest --cov=. --cov-report=xml
            - name: sonarsource
              uses: sonarsource/sonarqube-scan-action@master
              with:
                skipSignatureVerification: true
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
            - name: gates
              uses: sonarsource/sonarqube-quality-gate-action@master
              timeout-minutes: 5
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            - name: Install MinIO Client
              run: |
               E:\DevOps-Practice\mc.exe --version
            - name: Upload Model to MinIO
              run: |
                E:\DevOps-Practice\mc.exe alias set local ${{ secrets.MINIO_ENDPOINT }} ${{ secrets.MINIO_ACCESS_KEY }} ${{ secrets.MINIO_SECRET_KEY }}

                E:\DevOps-Practice\mc.exe cp models/churn_model.pkl local/churn-model-bucket-cicd-prem/model/churn_model.pkl

